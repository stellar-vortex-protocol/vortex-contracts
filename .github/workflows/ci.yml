name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ── GITHUB_TOKEN permission policy ────────────────────────────────────────────
#
# Hardened to the minimum required by every job in this workflow.
#
# Why contents: read and nothing else:
#   All jobs here only need to check out source code (contents: read).
#   None of them write commits, create releases, post PR comments, call the
#   Packages API, or use any other GitHub API scope.  GITHUB_STEP_SUMMARY
#   writes are local runner file writes — not a GitHub API permission.
#
# Trigger coverage:
#   For `pull_request` events from forks, GitHub already restricts the token
#   to read-only.  For `push` to `main` from the same repo, the default token
#   carries `contents: write`.  This explicit block overrides both trigger
#   types and removes that unneeded write privilege.
#
# Future jobs that need elevated scope:
#   Add an explicit job-level `permissions:` override with only the additional
#   scope that job requires (e.g. `pull-requests: write` for a PR comment job).
#   Do NOT widen the top-level block.
#
# Per-job audit (all trigger types, checked 2026-08-31):
#   fmt           — checkout only                    → contents: read  ✓
#   contract      — checkout, clippy, test           → contents: read  ✓
#   wasm-size     — checkout, build, STEP_SUMMARY    → contents: read  ✓
#   proptest      — checkout, cargo test             → contents: read  ✓
#   audit         — checkout, cargo audit            → contents: read  ✓
#   mutants       — checkout, cargo mutants          → contents: read  ✓
permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Changelog enforcement
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check CHANGELOG.md updated for source changes
        shell: bash
        run: |
          # Skip check if PR has the 'no-changelog-needed' label
          LABELS=$(gh pr view ${{ github.event.pull_request.number }} --json labels --jq '.labels[].name' || true)
          if echo "$LABELS" | grep -q "no-changelog-needed"; then
            echo "✓ PR labeled 'no-changelog-needed' — changelog check skipped"
            exit 0
          fi

          # Get list of changed files in this PR
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)

          # Check if any source files changed (intent_settlement/src/ or proof_registry/src/)
          SOURCE_FILES_CHANGED=$(echo "$CHANGED_FILES" | grep -E '(intent_settlement/src/|proof_registry/src/)' || true)

          if [ -z "$SOURCE_FILES_CHANGED" ]; then
            echo "✓ No source files changed — changelog not required"
            exit 0
          fi

          # Check if CHANGELOG.md was updated
          CHANGELOG_CHANGED=$(echo "$CHANGED_FILES" | grep -E '^CHANGELOG\.md$' || true)

          if [ -z "$CHANGELOG_CHANGED" ]; then
            echo "❌ CHANGELOG enforcement failed"
            echo ""
            echo "Source files changed but CHANGELOG.md was not updated:"
            echo "$SOURCE_FILES_CHANGED"
            echo ""
            echo "CONTRIBUTING.md requires: 'CHANGELOG.md updated under [Unreleased]'"
            echo ""
            echo "Options:"
            echo "  1. Update CHANGELOG.md with your changes (preferred)"
            echo "  2. Add 'no-changelog-needed' label if this PR is:"
            echo "     - Pure test-only changes"
            echo "     - Comment-only / documentation-only changes"
            echo "     - CI/tooling changes with no impact on contract behavior"
            exit 1
          fi

          echo "✓ CHANGELOG.md was updated"
          exit 0
    env:
      GH_TOKEN: ${{ github.token }}

  fmt:
    name: Formatting (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [intent_settlement, proof_registry]
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  contract:
    name: Contract (${{ matrix.crate }} / ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    # Needs: contents: read (checkout only). Inherits workflow-level minimum.
    strategy:
      fail-fast: false
      matrix:
        crate: [intent_settlement, proof_registry]
        # stable — tracks latest stable Rust
        # 1.78   — MSRV declared in README ("Rust 1.78+")
        toolchain: [stable, "1.78"]
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (${{ matrix.toolchain }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}
          # Separate cache per toolchain to avoid cross-contamination
          key: ${{ matrix.toolchain }}

      - name: Format check
        # Only enforce formatting on stable; MSRV rustfmt may produce different
        # output for features introduced after 1.78.
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check

      - name: Clippy
        # Identical to the command documented in README.md ("Build & Test").
        # -D warnings is required on ALL matrix legs so MSRV is lint-clean too.
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  wasm-size:
    name: Wasm size budget (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [intent_settlement, proof_registry]
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: intent_settlement
      - name: Install binaryen (wasm-opt) — pinned for a deterministic size
        run: |
          curl -sSfL \
            https://github.com/WebAssembly/binaryen/releases/download/version_132/binaryen-version_132-x86_64-linux.tar.gz \
            | sudo tar -xz -C /usr/local --strip-components=1
          wasm-opt --version
      - name: Build wasm
        run: cargo build --target wasm32-unknown-unknown --release
      - name: Optimize wasm
        shell: bash
        run: |
          # Measure the artifact that actually gets deployed: the release build
          # after `wasm-opt -Oz`, the same optimization `stellar contract
          # optimize` applies. The raw `cargo build` output is ~70 KB; -Oz
          # brings it to ~63.7 KB. binaryen is pinned above so this number is
          # reproducible across CI and local runs.
          RAW=$(ls target/wasm32-unknown-unknown/release/*.wasm | head -n1)
          wasm-opt -Oz \
            --enable-bulk-memory --enable-sign-ext --enable-mutable-globals \
            --enable-nontrapping-float-to-int --enable-reference-types \
            --enable-multivalue --strip-debug --strip-producers \
            "$RAW" -o "${RAW%.wasm}.optimized.wasm"
      - name: Check wasm size
        shell: bash
        run: |
          # Soroban's on-chain contract-wasm limit is 64 KB (65 536 bytes).
          # Budget: 64 500 bytes for the optimized artifact — ~1 KB under the
          # hard limit.
          #
          # NOTE (follow-up, now blocking): the contract is within ~1.8 KB of
          # the hard limit. The batch API (#199), list_solvers (#198) and the
          # solver_registry integration (#197) have consumed the headroom. A
          # dedicated size-reduction pass (dead-code audit, splitting
          # rarely-used entrypoints into a companion contract) must land before
          # the next feature.
          MAX_BYTES=64500
          WASM=$(ls target/wasm32-unknown-unknown/release/*.optimized.wasm | head -n1)
          SIZE=$(wc -c < "$WASM")
          echo "### Wasm size report (${{ matrix.crate }})" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Size (bytes) | Budget (bytes) | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ---- | -----------: | -------------: | ------ |" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE" -le "$MAX_BYTES" ]; then
            echo "| \`$(basename $WASM)\` | $SIZE | $MAX_BYTES | ✅ under budget |" >> "$GITHUB_STEP_SUMMARY"
            echo "Wasm size OK: $SIZE bytes (limit $MAX_BYTES bytes)"
          else
            echo "| \`$(basename $WASM)\` | $SIZE | $MAX_BYTES | ❌ over budget |" >> "$GITHUB_STEP_SUMMARY"
            echo "ERROR: Wasm size $SIZE bytes exceeds budget of $MAX_BYTES bytes." >&2
            exit 1
          fi

  solver-registry:
    name: solver_registry crate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solver_registry
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: solver_registry
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build wasm
        run: cargo build --target wasm32-unknown-unknown --release

  proptest:
    name: Bond-conservation proptest
    runs-on: ubuntu-latest
    # Needs: contents: read (checkout only). Inherits workflow-level minimum.
    defaults:
      run:
        working-directory: intent_settlement
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: intent_settlement
      - name: Bond conservation proptest
        # PROPTEST_CASES controls how many random sequences are generated per
        # test; 256 balances coverage against CI runtime.
        run: PROPTEST_CASES=256 cargo test --features testutils -- bond_conservation

  audit:
    name: Dependency audit (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [intent_settlement, proof_registry]
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit

  mutants:
    name: Mutation testing
    runs-on: ubuntu-latest
    # Needs: contents: read (checkout only). cargo-mutants mutates source in a
    # temporary copy on the runner — no GitHub API calls. Inherits workflow-level
    # minimum.
    defaults:
      run:
        working-directory: intent_settlement
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: intent_settlement
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked
      - name: Run mutation tests
        run: cargo mutants --copy-target=false

  integration-test:
    name: Soroban standalone integration test
    runs-on: ubuntu-latest
    # Needs: contents: read (checkout only). The test runs a local Docker
    # container and makes requests to it via HTTP — no GitHub API calls.
    # Inherits workflow-level minimum.
    services:
      docker:
        image: docker:dind
        options: >-
          --privileged
          --health-cmd "docker ps"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust and Stellar CLI
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: intent_settlement
      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli --features opt
      - name: Install required tools
        run: |
          apt-get update
          apt-get install -y docker.io curl jq
      - name: Build contract
        run: |
          cd intent_settlement
          stellar contract build
      - name: Run end-to-end integration test
        run: bash scripts/e2e-test.sh
        timeout-minutes: 10

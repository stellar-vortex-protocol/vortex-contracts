[package]
name = "vortex-intent-settlement"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[dependencies]
soroban-sdk = { version = "21.0.0" }
# Issue #190: proof-gated fills call into the ProofRegistry contract via its
# generated client. Path dependency; proof_registry also exposes an `rlib`
# crate-type so it can be linked here as a library.
vortex-proof-registry = { path = "../proof_registry" }

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }
proptest = { version = "1.5.0", default-features = false, features = ["std"] }
vortex-proof-registry = { path = "../proof_registry", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]

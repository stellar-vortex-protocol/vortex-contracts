[package]
name = "vortex-proof-registry"
version = "0.1.0"
edition = "2021"
publish = false

# `rlib` in addition to `cdylib` so `intent_settlement` can depend on this
# crate as a library (for `ProofRegistryClient`) while `stellar contract build`
# still emits the cdylib wasm (issue #190).
[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1

[dependencies]
soroban-sdk = { version = "21.0.0" }

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
